name: Deploy Backend to EC2

on:
  workflow_dispatch:
# NOTE: 자동 push 트리거 제거 — prod 배포는 항상 수동(workflow_dispatch)으로만.
# staging은 main push 시 자동 배포되어 검증 → 검증 끝나면 GitHub UI에서 prod 워크플로 수동 실행.

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  APP_DIR: /home/ec2-user/hailmary-backend
  UV_BIN: /home/ec2-user/.local/bin/uv

jobs:
  deploy:
    runs-on: [self-hosted, hailmary-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source to ${{ env.APP_DIR }}
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='fortuneteller-main' \
            --exclude='fortuneteller-main.zip' \
            --exclude='docker-compose.yml' \
            ./ "$APP_DIR/"

      - name: Write .env.prod
        run: |
          umask 077
          cat > "$APP_DIR/.env.prod" <<EOF
          APP_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          FORTUNETELLER_URL=${{ secrets.FORTUNETELLER_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          PAYAPP_USERID=${{ secrets.PAYAPP_USERID }}
          PAYAPP_LINKKEY=${{ secrets.PAYAPP_LINKKEY }}
          PAYAPP_LINKVAL=${{ secrets.PAYAPP_LINKVAL }}
          PAYAPP_FEEDBACK_URL=${{ secrets.PAYAPP_FEEDBACK_URL }}
          PAYAPP_RETURN_URL=${{ secrets.PAYAPP_RETURN_URL }}
          FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}
          AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_BASE_URL=${{ secrets.AMPLITUDE_BASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          CACHE_ENABLED=true
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL=${{ secrets.CLAUDE_MODEL }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_SES_SENDER=${{ secrets.AWS_SES_SENDER }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TEST_LOGIN_ENABLED=${{ secrets.TEST_LOGIN_ENABLED }}
          TEST_LOGIN_USERNAME=${{ secrets.TEST_LOGIN_USERNAME }}
          TEST_LOGIN_PASSWORD=${{ secrets.TEST_LOGIN_PASSWORD }}
          PORTONE_ENABLED=${{ secrets.PORTONE_ENABLED }}
          PORTONE_API_SECRET=${{ secrets.PORTONE_API_SECRET }}
          PORTONE_STORE_ID=${{ secrets.PORTONE_STORE_ID }}
          PORTONE_CHANNEL_KEY=${{ secrets.PORTONE_CHANNEL_KEY }}
          PORTONE_WEBHOOK_SECRET=${{ secrets.PORTONE_WEBHOOK_SECRET }}
          PORTONE_ALLOW_TEST_CHANNEL=${{ secrets.PORTONE_ALLOW_TEST_CHANNEL }}
          EOF

      - name: Install dependencies (uv sync)
        working-directory: ${{ env.APP_DIR }}
        run: $UV_BIN sync --frozen

      - name: Run database migrations
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -a
          . "$APP_DIR/.env.prod"
          set +a
          $UV_BIN run alembic upgrade head

      # HM-BE-67 후속: alembic 006이 빈 테이블만 만들어 70 row 시드 누락.
      # cache JSON 70개를 daily_templates 테이블에 upsert. idempotent라 매 배포 안전.
      - name: Seed 70 daily templates (idempotent upsert)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -a
          . "$APP_DIR/.env.prod"
          set +a
          $UV_BIN run python -X utf8 -m scripts.kkebi_gen.load_to_db

      - name: Restart backend service
        run: sudo /usr/bin/systemctl restart hailmary-backend.service

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.dohwaseonsaju.com/health || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi
            echo "[$i/30] status=$code, retry in 2s"
            sleep 2
          done
          echo "::error::Backend did not become healthy in 60s"
          sudo /usr/bin/journalctl -u hailmary-backend.service --since '2 minutes ago' --no-pager | tail -80
          exit 1
